# 发版流水线（tag → GitHub Release）
#
# 与 ci.yml 的关系：ci.yml 管"每次提交的验证"，本文件管"打 tag 时的发版"。
# 两者不重叠——发版**不重复跑测试**，而是信任已通过的 main 流水线结果，
# 只做「构建 → 自检 → 产出发布包 → 附到 Release」。
#
# 为什么发版必须自跑一次自检：CI 的绿灯来自 main 分支，而 tag 可能指向
# 任意提交（包括绕过 CI 的本地 tag）。让产物在发布前自己证明能跑起来，
# 比发布一个起不来的压缩包便宜得多。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '手动发版时填写的版本号（如 v0.1.0）'
        required: true

permissions:
  contents: write # 创建 Release 上传产物所需

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发版不取消：宁可等，也不能半途废掉一次发版

jobs:
  release:
    name: 构建发布包并创建 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 安装 Node（验证与运行链）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Bun（依赖安装与打包）
        uses: oven-sh/setup-bun@v2

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          TAG="${TAG:-$(node -p "require('./package.json').version")}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$VER"
          # 不一致就发版，下载的人拿到的是"版本号对不上内容"的产物
          if [ "$TAG" != "v$VER" ]; then
            echo "❌ tag ($TAG) 与 package.json 版本 (v$VER) 不一致，拒绝发布。"
            echo "   请先改 package.json 版本并合入 main，再打 tag。"
            exit 1
          fi

      - name: 完整验证（发版前跑，不信任任何旧绿灯）
        run: make verify-full

      - name: 构建自包含发布包
        run: make package

      - name: 产物自检（隔离目录解压后能起来）
        run: |
          set -e
          mkdir -p /tmp/relcheck && cd /tmp/relcheck
          tar -xzf "$GITHUB_WORKSPACE"/dist/headless-cms-*.tar.gz
          mkdir -p data
          # --selfcheck 完成装配即退出，无需常驻
          node app.mjs --selfcheck
          cd - >/dev/null

      - name: 记录校验和与文件清单
        id: meta
        run: |
          cd "$GITHUB_WORKSPACE"
          PKG=$(ls dist/headless-cms-*.tar.gz)
          echo "pkg=$(basename "$PKG")" >> "$GITHUB_OUTPUT"
          {
            echo '## 发布包'
            echo ''
            echo "| 文件 | 大小 | sha256 |"
            echo "|------|------|--------|"
            for f in dist/headless-cms-*.tar.gz; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)…\` |"
            done
          } > dist/RELEASE_NOTES.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/headless-cms-*.tar.gz
            dist/RELEASE_NOTES.md
